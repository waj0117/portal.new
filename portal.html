<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account · Smart City Portal</title><link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="css/style.css"></head>
<body class="app">
<main class="wrap">
<!-- AUTH -->
  <section id="login" class="view">
    <form class="panel" onsubmit="doLogin(event)">
      <h2>Login</h2>
      <input id="lEmail" type="email" placeholder="Email" required>
      <input id="lPass" type="password" placeholder="Password" required>
      <button>Login</button>
      <p class="muted">No account? <a href="#register">Register</a></p>
      <p class="muted">Admin demo: admin@city.gov / admin123</p>
    </form>
  </section>
  <section id="register" class="view">
    <form class="panel" onsubmit="doRegister(event)">
      <h2>Citizen Registration</h2>
      <input id="rName" placeholder="Full name" required>
      <input id="rEmail" type="email" placeholder="Email" required>
      <input id="rPhone" placeholder="Phone (optional)">
      <input id="rPass" type="password" placeholder="Password (min 6 chars)" required minlength="6">
      <button>Register</button>
      <p class="muted">Already registered? <a href="#login">Login</a></p>
    </form>
  </section>

  <!-- CITIZEN -->
  <section id="submit" class="view">
    <form class="panel wide" onsubmit="doSubmit(event)">
      <h2>Submit a Complaint</h2>
      <select id="cCat" required></select>
      <input id="cTitle" placeholder="Short title" required>
      <textarea id="cDesc" rows="4" placeholder="Describe the problem" required></textarea>
      <input id="cLoc" placeholder="Location / landmark / street" required>
      <select id="cPri">
        <option>Low</option><option selected>Medium</option><option>High</option>
      </select>
      <button>Submit Complaint</button>
    </form>
  </section>
  <section id="mine" class="view">
    <h2>My Complaints</h2>
    <div id="mineList"></div>
  </section>

  <!-- ADMIN -->
  <section id="admin" class="view">
    <h2>Administrator Dashboard</h2>
    <div id="stats" class="stats"></div>
    <div class="filter">
      <label>Filter:
        <select id="fStatus" onchange="loadAdmin()">
          <option value="">All</option><option>Pending</option>
          <option>In Progress</option><option>Resolved</option><option>Rejected</option>
        </select>
      </label>
      <span class="muted">Sorted by unresolved first, then priority</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Category</th><th>Title / Location</th><th>Citizen</th>
          <th>Priority</th><th>Status</th><th>Remark &amp; Update</th></tr></thead>
        <tbody id="adminRows"></tbody>
      </table>
    </div>
  </section>
</main>
<div id="toast"></div>
<script src="js/common.js"></script><script src="js/portal.js"></script>
</body></html>
