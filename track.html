<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track · Smart City Portal</title><link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<section class="tband">
  <h1>Track your complaint</h1>
  <p>Enter the complaint ID you received when you filed it.</p>
  <form class="track-box" onsubmit="event.preventDefault();doTrack()">
    <input id="trackId" placeholder="e.g. SCP-2026-00001" required aria-label="Complaint ID">
    <button>Search</button>
  </form>
</section>
<div class="tres"><div id="trackResult"></div></div>
<div id="toast"></div>
<script src="js/common.js"></script>
<script>
renderNav('track');
async function doTrack() {
  const out = $('trackResult'), id = $('trackId').value.trim();
  try {
    const c = await api('/track/' + encodeURIComponent(id));
    out.innerHTML = card(c, false) + '<div class="item"><h3>Status timeline</h3><div class="timeline">' +
      c.history.map(h => `<div><span class="badge ${cls(h.status)}">${h.status}</span>
        <span class="muted"> ${h.changed_at}</span><br>${esc(h.remark || '')}</div>`).join('') + '</div></div>';
  } catch (err) { out.innerHTML = `<div class="item"><b style="color:var(--bad)">${esc(err.message)}</b>
    <p class="muted">Check the ID and try again. It looks like SCP-2026-00001.</p></div>`; }
}
const q = new URLSearchParams(location.search).get('id');
if (q) { $('trackId').value = q; doTrack(); }
</script>
</body></html>
