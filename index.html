<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart City Portal</title><link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<section class="splash">
  <div class="moon"></div>
  <h1 class="rise">Smart City Portal</h1>
  <p class="rise">Report a problem on your street, follow it step by step, and see it resolved.</p>
  <a class="btn lamp rise" href="home.html">Enter the portal</a>
  <svg id="sky" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
</section>
<script>
// City skyline: buildings are drawn once, windows switch on one after another
const r = (a, b) => a + Math.random() * (b - a);
let back = '', front = '', x = -20;
while (x < 1220) { const w = r(60, 110) | 0, h = r(120, 300) | 0;
  back += `<rect x="${x}" y="${400 - h}" width="${w}" height="${h}" fill="#0f2238"/>`; x += w - 10; }
x = 0;
while (x < 1200) {
  const w = r(50, 100) | 0, h = r(80, 230) | 0;
  front += `<rect x="${x}" y="${400 - h}" width="${w}" height="${h}" fill="#0a1626"/>`;
  for (let wx = x + 8; wx < x + w - 10; wx += 16)
    for (let wy = 400 - h + 12; wy < 385; wy += 20)
      if (Math.random() < .42) front += `<rect class="w" x="${wx}" y="${wy}" width="7" height="10" rx="1" fill="#ffd166" style="animation-delay:${(.6 + Math.random() * 3.4).toFixed(2)}s"/>`;
  x += w + r(3, 12);
}
document.getElementById('sky').innerHTML = back + front;
</script>
</body></html>
